<!doctype html><html lang="en"><head><meta charset="utf-8"><title>HealthHub by MedSource letterhead</title><style>
@font-face{font-family:"Poppins";font-weight:700;src:url("assets/Poppins-Bold.ttf")}
@font-face{font-family:"Poppins";font-weight:500;src:url("assets/Poppins-Medium.ttf")}
@font-face{font-family:"Nunito";font-weight:600;src:url("../../brand/fonts/Nunito-600.woff2")}
@font-face{font-family:"Nunito";font-weight:700;src:url("../../brand/fonts/Nunito-700.woff2")}
/* HealthHub design system: flat navy #033F75, green #5FA122, grey #646464. Gradients stay inside the logo. */
:root{--navy:#033f75;--green:#5fa122;--grey:#646464}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Nunito",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;width:2560px}
.piece{position:relative;width:2480px;background:#fff;overflow:hidden}
.abs{position:absolute}
.bar{position:absolute;left:0;width:2480px;background:var(--navy)}
.acc{position:absolute;left:0;width:2480px;background:var(--green)}
/* lockup: mark + text block, text block centred on the cross */
.lock{position:absolute;left:177px;display:flex;align-items:center}
.lock img{display:block;flex:none}
.txt{display:flex;flex-direction:column;align-items:flex-start;font-family:"Poppins",sans-serif}
.name{display:flex;align-items:baseline;line-height:1;white-space:nowrap}
.wm{display:inline-flex}
.w{font-weight:700;letter-spacing:-.01em}
.by{font-weight:500;color:var(--grey)}
.by b{font-weight:700;color:var(--navy)}
.desc{font-weight:500;color:var(--grey);white-space:nowrap;line-height:1;text-transform:uppercase;letter-spacing:.06em}
/* tagline: Nunito SemiBold grey with a short green rule */
.tagwrap{position:absolute;right:320px;display:flex;flex-direction:column;align-items:stretch}
.tag{font-family:"Nunito",sans-serif;font-weight:600;color:var(--grey);white-space:nowrap;text-align:right;letter-spacing:.01em}
.tagwrap i{display:block;height:4px;background:var(--green);border-radius:2px}
</style></head><body>

<!-- FIRST PAGE HEADER 2480x500. spec: LETTERHEAD-SPEC.md. Zone A (177-1240, 360-430) and Zone B (1300-2160, 215-430) stay blank. Logo ends above y 350. -->
<div class="piece" id="h1" style="height:500px">
  <div class="bar" style="top:0;height:120px"></div>
  <div class="acc" style="top:108px;height:12px"></div>
  <div class="lock" id="lock1" style="top:120px;height:230px" data-gap="40" data-target="800" data-icon="200">
    <img src="assets/healthhub-mark.png" style="height:200px" alt="HealthHub mark">
    <div class="txt">
      <div class="name"><span class="wm"><span class="w" style="color:var(--navy)">Health</span><span class="w" style="color:var(--green)">Hub</span></span><span class="by">by <b>MedSource</b></span></div>
      <div class="desc">Diagnostics and Holistic Wellness</div>
    </div>
  </div>
  <div class="tagwrap" style="top:135px"><div class="tag" style="font-size:44px;line-height:52px">Advancing Healthcare Solutions</div><i style="margin-top:8px"></i></div>
  <div class="acc" style="top:440px;height:12px"></div>
  <div class="bar" style="top:440px;height:60px"></div>
  <div class="acc" style="top:440px;height:12px"></div>
</div>

<!-- LATER PAGES HEADER 2480x250 -->
<div class="piece" id="h2" style="height:250px">
  <div class="bar" style="top:0;height:56px"></div>
  <div class="acc" style="top:48px;height:8px"></div>
  <div class="lock" id="lock2" style="top:56px;height:162px" data-gap="30" data-target="580" data-icon="112">
    <img src="assets/healthhub-mark.png" style="height:112px" alt="HealthHub mark">
    <div class="txt">
      <div class="name"><span class="wm"><span class="w" style="color:var(--navy)">Health</span><span class="w" style="color:var(--green)">Hub</span></span><span class="by">by <b>MedSource</b></span></div>
      <div class="desc">Diagnostics and Holistic Wellness</div>
    </div>
  </div>
  <div class="tagwrap" style="top:108px"><div class="tag" style="font-size:38px;line-height:46px">Advancing Healthcare Solutions</div><i style="margin-top:8px"></i></div>
  <div class="acc" style="top:218px;height:8px"></div>
  <div class="bar" style="top:226px;height:24px"></div>
</div>

<!-- FOOTER 2480x250, every page -->
<div class="piece" id="f" style="height:250px">
  <div class="bar" style="top:0;height:24px"></div>
  <div class="acc" style="top:24px;height:8px"></div>
  <div class="lock" id="lock3" style="top:32px;height:186px" data-gap="0" data-target="640" data-icon="0">
    <div class="txt">
      <div class="name"><span class="wm"><span class="w" style="color:var(--navy)">Health</span><span class="w" style="color:var(--green)">Hub</span></span><span class="by">by <b>MedSource</b></span></div>
      <div class="desc">Diagnostics and Holistic Wellness</div>
    </div>
  </div>
  <div class="tagwrap" style="top:96px"><div class="tag" style="font-size:38px;line-height:46px">Advancing Healthcare Solutions</div><i style="margin-top:8px"></i></div>
  <div class="acc" style="top:218px;height:8px"></div>
  <div class="bar" style="top:226px;height:24px"></div>
</div>

<script>
// Proportions: by MedSource is 36% of the wordmark size; descriptor is tracked +6% and set to the exact width of the name line; icon to text gap and line gap scale with the wordmark.
function fit(lock){
  const name=lock.querySelector('.name'),desc=lock.querySelector('.desc'),by=lock.querySelector('.by'),txt=lock.querySelector('.txt'),img=lock.querySelector('img');
  const target=+lock.dataset.target, gap=+lock.dataset.gap;
  const setSize=px=>{name.querySelectorAll('.w').forEach(e=>e.style.fontSize=px+'px');by.style.fontSize=(px*.36)+'px';by.style.marginLeft=(px*.17)+'px';desc.style.marginTop=(px*.22)+'px'};
  setSize(100);
  const px=100*target/name.getBoundingClientRect().width; setSize(px);
  desc.style.fontSize='20px'; const w=desc.getBoundingClientRect().width; desc.style.fontSize=(20*name.getBoundingClientRect().width/w)+'px';
  if(img) txt.style.marginLeft=gap+'px';
}
document.fonts.ready.then(()=>{document.querySelectorAll('.lock').forEach(fit);document.body.dataset.ready='1'});
</script>
</body></html>
