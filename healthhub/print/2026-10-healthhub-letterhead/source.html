<!doctype html><html lang="en"><head><meta charset="utf-8"><title>HealthHub by MedSource letterhead</title><style>
@font-face{font-family:"Poppins";font-weight:700;src:url("assets/Poppins-Bold.ttf")}
@font-face{font-family:"Poppins";font-weight:500;src:url("assets/Poppins-Medium.ttf")}
@font-face{font-family:"Poppins";font-weight:400;src:url("assets/Poppins-Regular.ttf")}
@font-face{font-family:"Quicksand";font-weight:500;src:url("../../brand/fonts/quicksand-latin-500-normal.woff2")}
@font-face{font-family:"Quicksand";font-weight:600;src:url("../../brand/fonts/quicksand-latin-600-normal.woff2")}
@font-face{font-family:"Quicksand";font-weight:700;src:url("../../brand/fonts/quicksand-latin-700-normal.woff2")}
:root{--navy:#033f75;--green:#5fa122;--grey:#646464;--blue-d:#0757a8;--blue-l:#4aa7d6;--green-l:#a5db6b;--green-d:#4fa547}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Quicksand",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;width:2560px}
.piece{position:relative;width:2480px;background:#fff;overflow:hidden}
.abs{position:absolute}
#h1{height:500px}#h2{height:250px}#f{height:250px}
.topbar{left:0;top:0;width:2480px;background:linear-gradient(90deg,var(--blue-l) 0%,var(--blue-d) 100%)}
.botbar{left:0;width:2480px;background:linear-gradient(90deg,var(--green-l) 0%,var(--green-d) 100%)}
.lock{position:absolute;display:flex;align-items:center;gap:34px}
.lock img{display:block}
.txt{display:flex;flex-direction:column;align-items:flex-start;font-family:"Poppins",sans-serif}
.name{display:flex;align-items:baseline;gap:16px;line-height:1;white-space:nowrap}
.wm{display:inline-flex}
.name .w{font-weight:700;letter-spacing:-.01em}
.name .by{font-weight:500;color:var(--grey)}
.name .by b{font-weight:700;color:var(--navy)}
.desc{font-weight:500;color:var(--grey);white-space:nowrap;line-height:1;text-transform:uppercase}
.tag{font-family:"Quicksand",sans-serif;font-weight:700;color:var(--navy);white-space:nowrap;text-align:right}
</style></head><body>

<!-- FIRST PAGE HEADER 2480x500. spec: LETTERHEAD-SPEC.md. Zone A (177-1240, 360-430) and Zone B (1300-2160, 215-430) stay blank. Logo ends above y 350. -->
<div class="piece" id="h1">
  <div class="abs topbar" style="height:120px"></div>
  <div class="abs" style="left:0;top:108px;width:2480px;height:12px;background:linear-gradient(90deg,var(--green-l),var(--green-d))"></div>
  <div class="lock" id="lock1" style="left:177px;top:140px">
    <img src="assets/healthhub-mark.png" style="height:200px" alt="HealthHub mark">
    <div class="txt" id="txt1">
      <div class="name" id="name1"><span class="wm"><span class="wm"><span class="w" style="color:var(--navy)">Health</span><span class="w" style="color:var(--green)">Hub</span></span></span><span class="by" id="by1">by <b>MedSource</b></span></div>
      <div class="desc" id="desc1">Diagnostics and Holistic Wellness</div>
    </div>
  </div>
  <div class="abs tag" style="right:320px;top:130px;height:75px;display:flex;align-items:center;font-size:50px">Advancing Healthcare Solutions</div>
  <div class="abs botbar" style="top:440px;height:60px;background:linear-gradient(90deg,var(--green-l) 0%,var(--green-d) 100%)"></div>
  <div class="abs" style="left:0;top:440px;width:2480px;height:10px;background:linear-gradient(90deg,var(--blue-l),var(--blue-d))"></div>
</div>

<!-- LATER PAGES HEADER 2480x250 -->
<div class="piece" id="h2">
  <div class="abs topbar" style="height:56px"></div>
  <div class="abs" style="left:0;top:48px;width:2480px;height:8px;background:linear-gradient(90deg,var(--green-l),var(--green-d))"></div>
  <div class="lock" id="lock2" style="left:177px;top:84px;gap:24px">
    <img src="assets/healthhub-mark.png" style="height:120px" alt="HealthHub mark">
    <div class="txt" id="txt2">
      <div class="name" id="name2"><span class="wm"><span class="w" style="color:var(--navy)">Health</span><span class="w" style="color:var(--green)">Hub</span></span><span class="by" id="by2">by <b>MedSource</b></span></div>
      <div class="desc" id="desc2">Diagnostics and Holistic Wellness</div>
    </div>
  </div>
  <div class="abs tag" style="right:320px;top:112px;height:64px;display:flex;align-items:center;font-size:40px">Advancing Healthcare Solutions</div>
  <div class="abs botbar" style="top:226px;height:24px"></div>
</div>

<!-- FOOTER 2480x250, every page -->
<div class="piece" id="f">
  <div class="abs topbar" style="top:0;height:24px"></div>
  <div class="abs" style="left:180px;top:80px;font-family:'Poppins',sans-serif;font-weight:700;font-size:54px;line-height:64px;color:var(--navy)">Health<span style="color:var(--green)">Hub</span> <span style="font-weight:500;font-size:34px;color:var(--grey)">by <b style="font-weight:700;color:var(--navy)">MedSource</b></span></div>
  <div class="abs" style="left:180px;top:152px;font-family:'Poppins',sans-serif;font-weight:500;font-size:30px;line-height:40px;letter-spacing:.04em;color:var(--grey);text-transform:uppercase">Diagnostics and Holistic Wellness</div>
  <div class="abs tag" style="right:320px;top:96px;font-size:42px;line-height:56px">Advancing Healthcare Solutions</div>
  <div class="abs botbar" style="top:226px;height:24px"></div>
</div>

<script>
// fit descriptor width to the wordmark line, keep by MedSource smaller than the name
function fit(n,wordPx,byRatio,descGap,textH){
  const name=document.getElementById('name'+n), desc=document.getElementById('desc'+n), by=document.getElementById('by'+n);
  name.querySelectorAll('.w').forEach(e=>e.style.fontSize=wordPx+'px');
  by.style.fontSize=(wordPx*byRatio)+'px';
  name.style.gap=(wordPx*.16)+'px';
  const target=name.getBoundingClientRect().width;
  desc.style.fontSize='20px';desc.style.letterSpacing='0';
  const w=desc.getBoundingClientRect().width;
  desc.style.fontSize=(20*target/w)+'px';
  desc.style.marginTop=descGap+'px';
}
document.fonts.ready.then(()=>{fit(1,94,.36,18);fit(2,62,.36,12);document.body.dataset.ready='1'});
</script>
</body></html>
