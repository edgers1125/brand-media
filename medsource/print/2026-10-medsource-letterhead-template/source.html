<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MedSource Digital Sales letterhead</title>
<style>
@font-face{font-family:"Poppins";font-weight:400;src:url("assets/Poppins-Regular.ttf")}
@font-face{font-family:"Poppins";font-weight:500;src:url("assets/Poppins-Medium.ttf")}
@font-face{font-family:"Poppins";font-weight:700;src:url("assets/Poppins-Bold.ttf")}
:root{--forest:#445C44;--green:#7AB537;--greenstrong:#4A7F08;--navy:#033F75;--slate:#5A6470;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Poppins",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;width:2560px}
.piece{position:relative;width:2480px;background:var(--white);overflow:hidden}
.band{position:absolute;left:0;width:2480px}

/* First page header 2480 x 500 */
#h1{height:500px}
#h1 .logo{position:absolute;left:177px;top:150px;height:200px}
#h1 .addr{position:absolute;right:177px;top:150px;height:200px;display:flex;align-items:center;gap:32px}
#h1 .addr .txt{font-size:38px;line-height:54px;font-weight:400;color:var(--navy);text-align:right;letter-spacing:.01em}
#h1 .addr .txt b{font-weight:700}
#h1 .addr .txt b.tag{font-size:46px;line-height:64px;letter-spacing:.02em}
#h1 .addr .txt b.tag span{color:var(--greenstrong)}
#h1 .addr .rule{width:5px;height:176px;background:var(--green)}
#h1 .pin{width:64px;height:64px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;flex:none}

/* Later pages header 2480 x 250 (slim band) */
#h2{height:250px}
#h2 .logo{position:absolute;left:177px;top:60px;height:100px}
#h2 .tag{position:absolute;right:177px;top:76px;height:68px;display:flex;align-items:center;gap:28px;font-size:34px;font-weight:700;letter-spacing:.04em;color:var(--navy)}
#h2 .tag span{color:var(--greenstrong)}
#h2 .tag i{display:block;width:5px;height:68px;background:var(--green)}

/* Footer 2480 x 250 */
#f{height:250px}
#f .t{position:absolute;top:92px;font-size:34px;line-height:48px;letter-spacing:.06em}
#f .l{left:177px;color:var(--slate);font-weight:400}
#f .r{right:177px;color:var(--navy);font-weight:700;letter-spacing:.04em;font-size:40px}
#f .r span{color:var(--greenstrong)}
</style>
</head>
<body>

<div class="piece" id="h1">
  <div class="band" style="top:0;height:40px;background:var(--forest)"></div>
  <div class="band" style="top:40px;height:6px;background:var(--green)"></div>
  <img class="logo" src="assets/medsource-landscape.svg" alt="MedSource Medical Supplies and Equipment">
  <div class="addr">
    <div class="txt"><b class="tag">Certified #Med<span>Mura</span></b><br>0906 299 3555<br>sales.quotations@medsource.com.ph</div>
    <div class="rule"></div>
    <div class="pin"><svg width="34" height="34" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg></div>
  </div>
  <div class="band" style="top:442px;height:6px;background:var(--green)"></div>
  <div class="band" style="top:448px;height:20px;background:var(--navy)"></div>
</div>

<div class="piece" id="h2">
  <div class="band" style="top:0;height:22px;background:var(--forest)"></div>
  <div class="band" style="top:22px;height:4px;background:var(--green)"></div>
  <img class="logo" src="assets/medsource-landscape.svg" alt="MedSource Medical Supplies and Equipment">
  <div class="tag"><i></i><div>Certified #Med<span>Mura</span></div></div>
  <div class="band" style="top:192px;height:4px;background:var(--green)"></div>
  <div class="band" style="top:196px;height:14px;background:var(--navy)"></div>
</div>

<div class="piece" id="f">
  <div class="t l">DEVICES  ·  SUPPLIES  ·  EQUIPMENT  ·  MEDICINES</div>
  <div class="t r">#Med<span>Mura</span></div>
  <div class="band" style="top:196px;height:6px;background:var(--green)"></div>
  <div class="band" style="top:202px;height:48px;background:var(--navy)"></div>
</div>

</body>
</html>
