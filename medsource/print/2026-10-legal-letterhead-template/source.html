<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MedSource World letterhead</title>
<style>
@font-face{font-family:"Poppins";font-weight:400;src:url("assets/Poppins-Regular.ttf")}
@font-face{font-family:"Poppins";font-weight:500;src:url("assets/Poppins-Medium.ttf")}
@font-face{font-family:"Poppins";font-weight:700;src:url("assets/Poppins-Bold.ttf")}
:root{--forest:#445C44;--green:#7AB537;--navy:#033F75;--slate:#5A6470;--white:#FFFFFF}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888;font-family:"Poppins",sans-serif;display:flex;flex-direction:column;gap:40px;padding:40px;width:2560px}
.piece{position:relative;width:2480px;background:var(--white);overflow:hidden}
.band{position:absolute;left:0;width:2480px}
.tag{position:absolute;white-space:nowrap;font-weight:400;color:var(--forest);letter-spacing:.04em}

#h1{height:500px}

/* Later pages header 2480 x 250 (slim band) */
#h2{height:250px}
#h2 .logo{position:absolute;left:177px;top:56px;height:110px}
#h2 .tag{position:absolute;right:177px;top:50px;height:68px;display:flex;align-items:center;gap:28px;font-size:34px;font-weight:400;letter-spacing:.04em;color:var(--forest)}
#h2 .tag i{display:block;width:5px;height:68px;background:var(--green)}

/* Footer 2480 x 250 */
#f{height:250px}
#f .t{position:absolute;top:92px;font-size:34px;line-height:48px;letter-spacing:.06em}
#f .l{left:177px;color:var(--slate);font-weight:400}
#f .r{top:46px;right:177px;color:var(--navy);font-weight:700;letter-spacing:.14em}
</style>
</head>
<body>

<div class="piece" id="h1"><!-- spec: letterhead-first-page-spec.jpg; zone A (177-1240, 360-430) and zone B (1300-2160, 215-430) stay blank -->
  <div class="band" style="top:0;height:112px;background:var(--forest)"></div>
  <div class="band" style="top:112px;height:8px;background:var(--green)"></div>
  <img style="position:absolute;left:177px;top:140px;height:190px" src="assets/medsource-world.svg" alt="MedSource World">
  <div style="position:absolute;right:320px;top:130px;height:75px;display:flex;align-items:center;font-size:44px;letter-spacing:.02em;white-space:nowrap"><span style="font-weight:700;color:var(--forest)">Sourcing the Future of Healthcare</span></div>
  <div style="position:absolute;left:2217px;top:130px;width:6px;height:300px;background:var(--green)"></div>
  <div class="band" style="top:440px;height:8px;background:var(--green)"></div>
  <div class="band" style="top:448px;height:52px;background:var(--navy)"></div>
</div>

<div class="piece" id="h2">
  <div class="band" style="top:0;height:22px;background:var(--forest)"></div>
  <div class="band" style="top:22px;height:4px;background:var(--green)"></div>
  <img class="logo" src="assets/medsource-world.svg" alt="MedSource World">
  <div class="tag"><i></i><div>Sourcing the Future of Healthcare</div></div>
  <div class="band" style="top:192px;height:4px;background:var(--green)"></div>
  <div class="band" style="top:196px;height:14px;background:var(--navy)"></div>
</div>

<div class="piece" id="f">
  <div class="t l">IMPORTATION  ·  PROCUREMENT  ·  DISTRIBUTION</div>
  <div class="t r">MEDSOURCE WORLD</div>
  <div class="band" style="top:196px;height:6px;background:var(--green)"></div>
  <div class="band" style="top:202px;height:48px;background:var(--navy)"></div>
</div>

</body>
</html>
